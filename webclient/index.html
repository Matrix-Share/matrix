<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relayne — client demo</title>
<style>
  :root { color-scheme: light dark; --a: #ea580c; --b: #f4f4f7; --i: #0d0d12; --m: #6b6b76; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 560px; padding: 24px 16px; margin: 0 auto; color: var(--i); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--m); margin: 0 0 20px; font-size: 13.5px; }
  label { font-size: 12px; color: var(--m); display: block; margin: 14px 0 4px; }
  input, textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid #0002;
    border-radius: 10px; background: var(--b); color: inherit; }
  textarea { resize: vertical; font-size: 12px; font-family: ui-monospace, monospace; }
  button { font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-radius: 10px;
    background: var(--a); color: #fff; cursor: pointer; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  #log { border: 1px solid #0001; border-radius: 12px; padding: 12px; min-height: 180px;
    margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 7px 11px; border-radius: 12px; }
  .msg.me { align-self: flex-end; background: var(--a); color: #fff; }
  .msg.them { align-self: flex-start; background: var(--b); }
  small { color: var(--m); }
</style>
</head>
<body>
  <h1>Relayne client demo</h1>
  <p class="sub">Each browser holds its own keys and does its own crypto (WASM). The
    relay only ever sees ciphertext. <span id="status">connecting…</span></p>

  <label>Your address <small>(this is you; others send to it)</small></label>
  <div id="me" class="mono">…</div>

  <label>Your pairing code <small>(copy and give to the other person)</small></label>
  <textarea id="mycode" rows="3" readonly></textarea>

  <label>Their pairing code <small id="to">(paste it, then Save)</small></label>
  <textarea id="contact" rows="3" placeholder="paste the other person's code"></textarea>
  <div class="row" style="justify-content:flex-end"><button id="save">Save contact</button></div>

  <div id="log"></div>
  <div class="row">
    <input id="text" placeholder="Type a message…" autocomplete="off" />
    <button id="send">Send</button>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
