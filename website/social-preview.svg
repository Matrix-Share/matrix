<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Lifeline — messaging that works when the network doesn't">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#141026"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="grad-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#d8b4fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="18%" r="80%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="60%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tileh" cx="30%" cy="26%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="55%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- faint mesh backdrop -->
  <g stroke="#818cf8" stroke-width="1.4" opacity=".18">
    <path d="M120 500 L300 430 L470 520 L640 440 L820 520 L1010 440 L1180 520"/>
    <path d="M300 430 L470 300 L640 440 M470 300 L640 200 L820 320 M820 320 L1010 200 L1180 300"/>
  </g>
  <g fill="#818cf8" opacity=".5">
    <circle cx="300" cy="430" r="4"/><circle cx="470" cy="300" r="4"/><circle cx="640" cy="440" r="4"/>
    <circle cx="820" cy="320" r="4"/><circle cx="1010" cy="200" r="4"/><circle cx="1180" cy="300" r="4"/>
  </g>

  <!-- logo tile -->
  <g transform="translate(96,150)">
    <rect width="112" height="112" rx="28" fill="url(#tile)"/>
    <rect width="112" height="112" rx="28" fill="url(#tileh)"/>
    <g transform="scale(1.75)">
      <path d="M8 36 H24 L29 16 L36 50 L41 36 H56" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8" cy="36" r="4.2" fill="#fff"/><circle cx="56" cy="36" r="4.2" fill="#fff"/><circle cx="29" cy="16" r="4.6" fill="#fff"/>
    </g>
  </g>
  <text x="240" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3" fill="#fafafa">Lifeline</text>

  <!-- tagline -->
  <text x="98" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#e4e4e7">Messaging that works</text>
  <text x="98" y="424" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#e4e4e7">when the network <tspan fill="url(#grad-text)">doesn't.</tspan></text>

  <!-- trust row -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#a1a1aa">
    <text x="98" y="516">Offline mesh</text>
    <text x="330" y="516">·</text>
    <text x="360" y="516">End-to-end encrypted</text>
    <text x="700" y="516">·</text>
    <text x="730" y="516">No servers</text>
    <text x="920" y="516">·</text>
    <text x="950" y="516">Open source</text>
  </g>
</svg>
