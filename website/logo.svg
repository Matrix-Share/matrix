<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lifeline">
  <defs>
    <linearGradient id="llg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="llh" cx="30%" cy="26%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- app tile -->
  <rect width="64" height="64" rx="16" fill="url(#llg)"/>
  <rect width="64" height="64" rx="16" fill="url(#llh)"/>
  <!-- faint mesh links behind the pulse -->
  <g stroke="#ffffff" stroke-width="1.4" opacity=".28" stroke-linecap="round">
    <path d="M16 36 L29 16"/>
    <path d="M29 16 L48 36"/>
  </g>
  <!-- the lifeline: a heartbeat pulse hopping through nodes -->
  <path d="M8 36 H24 L29 16 L36 50 L41 36 H56"
        fill="none" stroke="#ffffff" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- nodes: two endpoints + the relay at the peak -->
  <circle cx="8"  cy="36" r="4.2" fill="#ffffff"/>
  <circle cx="56" cy="36" r="4.2" fill="#ffffff"/>
  <circle cx="29" cy="16" r="4.6" fill="#ffffff"/>
</svg>
