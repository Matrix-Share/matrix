<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Relayne">
  <defs>
    <linearGradient id="llg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset=".55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="llh" cx="30%" cy="26%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- app tile -->
  <rect width="64" height="64" rx="16" fill="url(#llg)"/>
  <rect width="64" height="64" rx="16" fill="url(#llh)"/>
  <!-- faint mesh backdrop -->
  <g stroke="#ffffff" stroke-width="1.3" opacity=".22" stroke-linecap="round">
    <path d="M12 44 L32 22"/><path d="M32 22 L52 44"/><path d="M12 44 L52 44"/>
  </g>
  <!-- relay hops: a message carried across nodes (solid = delivered hop, dashed = next hop) -->
  <path d="M12 44 Q21 20 32 24" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M32 24 Q43 20 52 44" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity=".6" stroke-dasharray="1.6 5"/>
  <!-- nodes: two endpoints + the relay at the peak -->
  <circle cx="12" cy="44" r="4" fill="#ffffff"/>
  <circle cx="52" cy="44" r="4" fill="#ffffff"/>
  <circle cx="32" cy="24" r="4.8" fill="#ffffff"/>
  <!-- the message in transit -->
  <circle cx="21.5" cy="28.8" r="2.7" fill="#ffffff"/>
</svg>
