[package]
name = "lifeline-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "External-network adapters that give Lifeline connectivity over other networks (Nostr relays, and a template for Reticulum/Meshtastic/…) behind the transport::ExternalNet seam."

[dependencies]
lifeline-transport = { path = "../transport" }
lifeline-proto = { path = "../proto" }
serde.workspace = true
serde_json = "1"
sha2.workspace = true
secp256k1 = { version = "0.29", features = ["rand-std", "hashes"] }
rand.workspace = true

[dev-dependencies]
lifeline-core = { path = "../core" }
