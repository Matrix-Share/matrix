[package]
name = "lifeline-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "External-network adapters that give Lifeline connectivity over other networks (Nostr relays, and a template for Reticulum/Meshtastic/…) behind the transport::ExternalNet seam."

[dependencies]
lifeline-transport = { path = "../transport" }
lifeline-proto = { path = "../proto" }
serde.workspace = true
serde_json = "1"
sha2.workspace = true
secp256k1 = { version = "0.29", features = ["rand-std", "hashes"] }
rand.workspace = true

# Optional: a live WebSocket Nostr relay client (`ws` feature). Kept off by
# default so the core codec + adapters build without the async/TLS stack.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync"], optional = true }
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

# Optional: the Meshtastic adapter. `prost` gives us the real Meshtastic
# protobuf wire format (ServiceEnvelope/MeshPacket); `rumqttc` is the live
# (synchronous) MQTT client for the `mqtt` feature.
prost = { version = "0.13", optional = true }
rumqttc = { version = "0.24", optional = true }
tracing = { version = "0.1", optional = true }

[features]
ws = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# Meshtastic packet codec + `ExternalNet` adapter (testable over a mock bus).
meshtastic = ["dep:prost"]
# Live MQTT transport for the Meshtastic adapter (real brokers / devices).
mqtt = ["meshtastic", "dep:rumqttc", "dep:tracing"]

[dev-dependencies]
lifeline-core = { path = "../core" }
lifeline-engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
