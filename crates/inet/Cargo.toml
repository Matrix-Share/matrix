[package]
name = "lifeline-inet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Internet-over-mesh gateway for Project Lifeline: a node with real internet lets *authorized* users reach it through the mesh (a store-and-forward web proxy). Mesh messages stay open to all; internet egress is node-level, capability-authorized, with SSRF guards. Egress authority rides attenuatable, offline-verifiable capability tokens. Transport-agnostic core, testable without a network."

[features]
# A real blocking HTTP fetcher for the gateway. Off by default so the core stays
# network-free and dependency-light; enable it on a node that runs an exit.
http = ["dep:ureq"]

[dependencies]
lifeline-proto = { path = "../proto" }
serde.workspace = true
serde_bytes.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
thiserror.workspace = true
url = "2"
ureq = { version = "2", optional = true }
