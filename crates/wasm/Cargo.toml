[package]
name = "lifeline-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser (WASM) bindings for Relayne client-side identity + crypto, so each tab holds its own keys and the server stays zero-knowledge."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lifeline-core = { path = "../core" }
wasm-bindgen = "0.2"
serde_json = "1"

# wasm32 has no OS RNG; route getrandom (pulled by rand/OsRng) through the browser crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
