[package]
name = "lifeline-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Project Lifeline node daemon: runs the mesh engine and serves a web GUI + HTTP/WS API for chatting over the mesh."

[[bin]]
name = "lifeline-node"
path = "src/main.rs"

[dependencies]
lifeline-proto = { path = "../proto" }
lifeline-core = { path = "../core" }
lifeline-router = { path = "../router" }
lifeline-sync = { path = "../sync" }
lifeline-transport = { path = "../transport" }
lifeline-sim = { path = "../sim" }
lifeline-relay = { path = "../relay" }
# Optional: live connectivity over external networks (Nostr / Meshtastic). The
# specific bridge features are pulled by the node's own `nostr`/`meshtastic`.
lifeline-bridge = { path = "../bridge", optional = true }

serde.workspace = true
serde_json = "1"
ciborium.workspace = true
# QR rendering for the invite code (FR-3): we build the SVG ourselves from the
# module matrix, so only the encoder is needed.
qrcode = { version = "0.14", default-features = false }

tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Bridge the node onto the global Nostr relay network as an extra bearer.
# Off by default so the base daemon avoids the async-WebSocket/TLS/secp stack.
nostr = ["dep:lifeline-bridge", "lifeline-bridge/ws"]
# Bridge the node onto the Meshtastic LoRa mesh over MQTT as an extra bearer.
meshtastic = ["dep:lifeline-bridge", "lifeline-bridge/mqtt"]
