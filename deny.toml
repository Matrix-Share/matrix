# cargo-deny configuration — supply-chain policy for the Rust workspace.
# Run locally with `cargo deny check`; enforced in CI (.github/workflows/security.yml).
# See docs/SSDLC.md.

[advisories]
# Fail on any known RustSec advisory in the dependency tree.
version = 2
yanked = "deny"
ignore = [
    # `instant` is unmaintained (transitive, time helper). No fix is available
    # upstream and it carries no known vulnerability — only an unmaintained
    # notice. Revisit when a dependent drops it.
    "RUSTSEC-2024-0384",
]

[licenses]
version = 2
# Allow only OSI-approved, permissive licenses compatible with Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Multiple versions of the same crate is noisy for a large tree; warn.
multiple-versions = "warn"
# The only wildcard deps in this workspace are the crates' own path dependencies
# on each other (a monorepo app, not published to crates.io). All *external*
# dependency versions are pinned centrally in `[workspace.dependencies]`, so a
# blanket wildcard ban would only flag the legitimate internal path deps.
wildcards = "allow"

[sources]
# Only allow crates from the official registry (no unvetted git/registry sources).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
