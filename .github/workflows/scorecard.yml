name: scorecard

# OpenSSF Scorecard — automated assessment of our open-source security posture
# (branch protection, code review, pinned dependencies, dangerous workflows,
# token permissions, SAST, …). Results appear in the Security tab and feed the
# Scorecard badge in the README. See docs/SSDLC.md.
on:
  branch_protection_rule:
  schedule:
    - cron: "18 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
